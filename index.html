<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobros Streaming</title>
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<style>
  :root{--bg:#f4f3fb;--ink:#16142b;--muted:#6b6886}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0e1a;--ink:#f1f0fa;--muted:#a19dbd}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .bar{position:fixed;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;padding-top:env(safe-area-inset-top);background:#312e81;color:#fff;font-size:13px;font-weight:700;z-index:2}
  .bar a{color:#c7d2fe;text-decoration:none;font-weight:600;font-size:12px}
  iframe{position:fixed;top:calc(34px + env(safe-area-inset-top));left:0;width:100%;height:calc(100% - 34px - env(safe-area-inset-top));border:0;background:var(--bg)}
  .load{position:fixed;inset:34px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:var(--bg);z-index:1;padding:16px}
  .load.hide{display:none}
  .s{width:36px;height:36px;border:4px solid #ece9ff;border-top-color:#4338ca;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .load p{color:var(--muted);margin:0;font-size:14px;max-width:320px}
  .btn{display:none;background:#4338ca;color:#fff;text-decoration:none;padding:11px 18px;border-radius:12px;font-weight:700}
  .btn.show{display:inline-block}
</style>
</head>
<body>
  <div class="bar"><span>📺 Cobros Streaming</span><a href="https://script.google.com/macros/s/AKfycbza5C2hjNLXl6PSixXslbEB65P0LQEC28Tew2CSydozfMJytGPhPPe-XNOfkGgjyMO8/exec" target="_blank" rel="noopener">Abrir en Google ↗</a></div>
  <div class="load" id="load">
    <div class="s"></div>
    <p id="msg">Cargando tus cobros…</p>
    <a class="btn" id="btn" href="https://script.google.com/macros/s/AKfycbza5C2hjNLXl6PSixXslbEB65P0LQEC28Tew2CSydozfMJytGPhPPe-XNOfkGgjyMO8/exec">Entrar a la app</a>
  </div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbza5C2hjNLXl6PSixXslbEB65P0LQEC28Tew2CSydozfMJytGPhPPe-XNOfkGgjyMO8/exec" title="Cobros Streaming" allow="clipboard-write"></iframe>
  <script>
    var f=document.getElementById('app'), l=document.getElementById('load');
    f.addEventListener('load',function(){ l.classList.add('hide'); });
    setTimeout(function(){
      document.getElementById('msg').textContent='¿No carga? Inicia sesión con tu cuenta de Google o entra directo:';
      document.getElementById('btn').classList.add('show');
    },8000);
  </script>
</body>
</html>
